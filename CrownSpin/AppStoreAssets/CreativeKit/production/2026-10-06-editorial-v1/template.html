<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endless Crown — editorial artwork</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #201e1b; }
  .art { position: relative; overflow: hidden; isolation: isolate; }
  .scene { position: absolute; inset: 0; transform-origin: 0 0; }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; }
  .readability { position: absolute; inset: 0; pointer-events: none; }
  .search .readability { background: linear-gradient(115deg, #0005 0%, #0002 23%, transparent 42%); }
  .capture { position: absolute; left: 0; top: 0; width: 416px; height: 496px; border-radius: 60px; transform-origin: 0 0; }
  .copy { position: absolute; color: #f7f6f2; font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-shadow: 0 1px 6px #0002; }
  .brand { margin: 0 0 26px; font-weight: 400; color: #e0ddd5; }
  h1 { margin: 0; font-weight: 650; line-height: 1.14; letter-spacing: -1.5px; }
  h1 span { display: block; white-space: nowrap; }
  .search .brand { margin-bottom: 20px; }
</style>
<main class="art" aria-label="Endless Crown App Store creative">
  <div class="scene">
    <img class="photo" alt="Natural wrist shot with a finger turning the Watch Crown">
    <div class="readability"></div>
    <img class="capture" alt="Authentic Endless Crown interface, Clicks selected, item 4698">
    <div class="copy"><p class="brand">Endless Crown</p><h1></h1></div>
  </div>
</main>
<script>
// Map the unmodified screenshot rectangle onto the photographed display plane.
function projection(width, height, corners) {
  const source = [[0, 0], [width, 0], [width, height], [0, height]];
  const a = [], b = [];
  source.forEach(([x, y], i) => {
    const [u, v] = corners[i];
    a.push([x, y, 1, 0, 0, 0, -u*x, -u*y]); b.push(u);
    a.push([0, 0, 0, x, y, 1, -v*x, -v*y]); b.push(v);
  });
  for (let i = 0; i < 8; i++) {
    let pivot = i;
    for (let j = i+1; j < 8; j++) if (Math.abs(a[j][i]) > Math.abs(a[pivot][i])) pivot = j;
    [a[i], a[pivot]] = [a[pivot], a[i]]; [b[i], b[pivot]] = [b[pivot], b[i]];
    const divisor = a[i][i];
    for (let k = i; k < 8; k++) a[i][k] /= divisor;
    b[i] /= divisor;
    for (let j = 0; j < 8; j++) if (j !== i) {
      const factor = a[j][i];
      for (let k = i; k < 8; k++) a[j][k] -= factor*a[i][k];
      b[j] -= factor*b[i];
    }
  }
  const [a0,a1,a2,a3,a4,a5,a6,a7] = b;
  return `matrix3d(${[a0,a3,0,a6,a1,a4,0,a7,0,0,1,0,a2,a5,0,1].join(',')})`;
}
(async () => {
  const manifest = await fetch('manifest.json').then(response => response.json());
  const params = new URLSearchParams(location.search);
  const id = params.get('placement') || 'header';
  const p = manifest.placements.find(item => item.id === id);
  if (!p) throw new Error('Unknown placement');
  const art = document.querySelector('.art');
  art.classList.add(id);
  const reviewScale = params.has('review') ? Math.min(1, innerWidth / p.width) : 1;
  art.style.width = `${p.width*reviewScale}px`;
  art.style.height = `${p.height*reviewScale}px`;
  const scene = document.querySelector('.scene');
  scene.style.width = `${p.photoSize[0]}px`;
  scene.style.height = `${p.photoSize[1]}px`;
  scene.style.transform = `scale(${p.width/p.photoSize[0]*reviewScale},${p.height/p.photoSize[1]*reviewScale})`;
  document.querySelector('.photo').src = p.photo;
  const capture = document.querySelector('.capture');
  capture.src = manifest.capture.path;
  capture.style.transform = projection(416,496,p.quad);
  const copy = document.querySelector('.copy');
  copy.style.left = `${p.copy.x}px`; copy.style.top = `${p.copy.y}px`;
  document.querySelector('.brand').style.fontSize = `${p.copy.brandSize}px`;
  const heading = document.querySelector('h1');
  heading.style.fontSize = `${p.copy.headingSize}px`;
  for (const line of manifest.headline) {
    const span = document.createElement('span'); span.textContent = line; heading.append(span);
  }
  await Promise.all([...document.images].map(img => img.decode()));
  await document.fonts.ready;
  art.dataset.ready = 'true';
})().catch(error => { document.body.dataset.error = error.message; });
</script>
</html>
